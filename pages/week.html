<!DOCTYPE html>
<html lang="en" data-theme="sepia" data-font="serif" data-spacing="normal" data-margins="normal">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Week — The Desire of Ages</title>
  <link rel="stylesheet" href="../assets/css/shared.css" />
  <style>
    /* ── Theme variables ── */
    html { --reading-font: 'Lora', Georgia, serif; --reading-lh: 1.95; --reading-px: 40px; }
    html[data-theme="light"] { --bg:#ffffff; --text:#1a1614; --border:#e0d8d0; --muted:#8b7355; }
    html[data-theme="dark"]  { --bg:#18120e; --text:#e8e0d4; --border:#3a2e28; --muted:#9a8a7a; --accent:#c4724a; }
    html[data-font="sans"]   { --reading-font: -apple-system,'Segoe UI',Arial,sans-serif; }
    html[data-spacing="compact"]  { --reading-lh: 1.55; }
    html[data-spacing="relaxed"]  { --reading-lh: 2.45; }
    html[data-margins="narrow"]   { --reading-px: 14px; }
    html[data-margins="wide"]     { --reading-px: 72px; }

    html, body { height:100%; overflow:hidden; background:var(--bg); color:var(--text); font-family:var(--reading-font); margin:0; transition:background .25s,color .25s; }
    .page-shell { display:flex; flex-direction:column; height:100%; }

    /* ── Topbar ── */
    .topbar { display:flex; align-items:center; justify-content:space-between; padding:13px 28px; border-bottom:1px solid var(--border); flex-shrink:0; background:var(--bg); transition:background .25s; }
    .topbar-logo { display:flex; align-items:center; justify-content:center; width:38px; height:38px; border-radius:50%; background:var(--accent); text-decoration:none; flex-shrink:0; }
    .topbar-logo span { font-family:'Playfair Display',serif; font-size:12px; font-weight:700; color:#fff; letter-spacing:.5px; }
    .topbar-center { display:flex; align-items:center; gap:6px; }
    .tb-btn { background:transparent; border:1.5px solid var(--border); border-radius:7px; color:var(--muted); cursor:pointer; font-family:var(--reading-font); padding:5px 11px; line-height:1; transition:border-color .2s,color .2s,background .2s; font-size:.82rem; }
    .tb-btn:hover { border-color:var(--accent); color:var(--accent); }
    .tb-btn.icon-btn { font-size:1rem; padding:5px 9px; }
    .back-link { display:flex; align-items:center; gap:5px; font-size:.78rem; letter-spacing:.08em; text-transform:uppercase; color:var(--muted); text-decoration:none; transition:color .2s; flex-shrink:0; }
    .back-link::before { content:'←'; font-size:.9rem; }
    .back-link:hover { color:var(--accent); }

    /* ── Settings panel ── */
    .settings-panel { max-height:0; overflow:hidden; background:var(--bg); border-bottom:1px solid transparent; flex-shrink:0; transition:max-height .38s cubic-bezier(.4,0,.2,1), padding .32s ease, border-color .3s, background .25s; padding:0 28px; }
    .settings-panel.open { max-height:420px; padding:16px 28px 20px; border-bottom-color:var(--border); }
    .settings-grid { display:grid; grid-template-columns:1fr 1fr; gap:14px 28px; }
    .settings-row { display:flex; flex-direction:column; gap:7px; }
    .settings-label { font-size:.63rem; letter-spacing:.18em; text-transform:uppercase; color:var(--muted); }
    .seg-group { display:flex; gap:5px; flex-wrap:wrap; }
    .seg-btn { font-size:.78rem; padding:6px 14px; background:transparent; border:1.5px solid var(--border); border-radius:20px; color:var(--muted); cursor:pointer; font-family:var(--reading-font); transition:border-color .18s, color .18s, background .18s, transform .12s, box-shadow .18s; white-space:nowrap; }
    .seg-btn:hover { border-color:var(--accent); color:var(--accent); }
    .seg-btn:active { transform:scale(.94); }
    .seg-btn.active { background:var(--accent); border-color:var(--accent); color:#fff; box-shadow:0 2px 8px rgba(122,59,30,.28); }
    #settings-btn { transition:transform .3s ease, border-color .2s, color .2s; }
    #settings-btn.open { transform:rotate(45deg); color:var(--accent); border-color:var(--accent); }

    /* ── Week header ── */
    .week-header { padding:12px 28px 0; flex-shrink:0; }
    .week-label { font-size:.68rem; letter-spacing:.2em; text-transform:uppercase; color:var(--muted); }
    .week-title-text { font-family:'Playfair Display',serif; font-size:clamp(.95rem,2vw,1.3rem); font-style:italic; color:var(--accent); margin:3px 0 2px; }
    .week-dates-text { font-size:.78rem; color:var(--muted); }

    /* ── Day tabs ── */
    .day-tabs { display:flex; padding:10px 28px 0; flex-shrink:0; border-bottom:1px solid var(--border); overflow-x:auto; }
    .day-tab { flex:1; min-width:52px; text-align:center; padding:9px 4px; font-size:.67rem; letter-spacing:.1em; text-transform:uppercase; color:var(--muted); cursor:pointer; border-bottom:2px solid transparent; transition:color .2s,border-color .2s; position:relative; user-select:none; white-space:nowrap; }
    .day-tab:hover { color:var(--accent); }
    .day-tab.active { color:var(--accent); border-bottom-color:var(--accent); font-weight:600; }
    .day-tab.done::after { content:'✓'; font-size:.55rem; position:absolute; top:3px; right:5px; color:#3a7d44; }

    /* ── Reading area ── */
    .reading-area { flex:1; overflow-y:auto; overflow-x:hidden; padding:32px 0 80px; position:relative; }
    .reading-area.page-mode { overflow:hidden; padding:0; }
    .reading-inner { max-width:720px; margin:0 auto; padding:0 var(--reading-px); }
    .reading-area.page-mode .reading-inner { overflow:hidden; height:100%; padding:24px var(--reading-px) 12px; box-sizing:border-box; }

    /* ── Chapter image ── */
    .day-image { width:100%; max-height:260px; object-fit:cover; border-radius:10px; margin-bottom:24px; opacity:0; transition:opacity .4s; }
    .day-image.visible { opacity:1; }

    /* ── Day title ── */
    .day-heading { font-family:'Playfair Display',serif; font-size:1rem; color:var(--accent); font-style:italic; margin:0 0 18px; }

    /* ── Reading text ── */
    .reading-text p { font-family:var(--reading-font); font-size:var(--reading-font-size,1.05rem); line-height:var(--reading-lh); color:var(--text); text-indent:2em; text-align:justify; margin:0 0 .6em; transition:color .25s; }
    .reading-text p:first-child { text-indent:0; }

    /* ── No content ── */
    .no-content { color:var(--muted); font-style:italic; font-size:1rem; line-height:1.8; padding:20px 0; }

    /* ── Pagination nav ── */
    .page-nav { display:flex; align-items:center; justify-content:space-between; padding:10px 20px 14px; border-top:1px solid var(--border); flex-shrink:0; background:var(--bg); gap:12px; }
    .page-nav-btn { display:flex; align-items:center; gap:6px; background:var(--accent); border:none; border-radius:40px; color:#fff; cursor:pointer; font-size:.82rem; padding:9px 22px; font-family:var(--reading-font); transition:opacity .2s, transform .15s; letter-spacing:.04em; flex-shrink:0; }
    .page-nav-btn:hover:not(:disabled) { opacity:.85; }
    .page-nav-btn:active:not(:disabled) { transform:scale(.96); }
    .page-nav-btn:disabled { background:var(--border); color:var(--muted); cursor:default; opacity:.6; }
    .page-counter { font-size:.72rem; letter-spacing:.12em; color:var(--muted); text-align:center; flex:1; }

    /* ── Quiz ── */
    .quiz-block { margin-top:32px; padding:22px 24px; background:var(--bg); border:1px solid var(--border); border-radius:12px; }
    .quiz-label { font-size:.67rem; letter-spacing:.22em; text-transform:uppercase; color:var(--accent); font-weight:600; }
    .quiz-question { font-size:var(--reading-font-size,.98rem); line-height:1.75; color:var(--text); font-style:italic; margin:10px 0 16px; font-family:var(--reading-font); }
    .quiz-choices { display:flex; flex-wrap:wrap; gap:9px; }
    .choice-btn { padding:9px 20px; font-family:var(--reading-font); font-size:.86rem; color:var(--accent); background:transparent; border:1.5px solid var(--accent); border-radius:40px; cursor:pointer; letter-spacing:.04em; transition:background .2s,color .2s; }
    .choice-btn:hover:not(:disabled) { background:var(--accent); color:#fff; }
    .choice-btn:disabled { cursor:default; }
    .choice-btn.correct { background:#3a7d44; border-color:#3a7d44; color:#fff; }
    .choice-btn.wrong   { background:#b94040; border-color:#b94040; color:#fff; opacity:.7; }
    .quiz-feedback { font-size:.88rem; font-style:italic; line-height:1.6; margin-top:12px; min-height:18px; font-family:var(--reading-font); }
    .quiz-feedback.correct { color:#3a7d44; }
    .quiz-feedback.wrong   { color:#b94040; }

    /* ── Complete Day btn ── */
    .complete-day-btn { display:none; margin-top:24px; padding:11px 34px; background:var(--accent); color:#fff; border:none; border-radius:40px; font-family:var(--reading-font); font-size:.88rem; letter-spacing:.04em; cursor:pointer; transition:opacity .2s; }
    .complete-day-btn:hover { opacity:.85; }
    .complete-day-btn.show { display:inline-block; }

    /* ── Done banner ── */
    .done-banner { display:none; align-items:center; gap:9px; margin-top:24px; padding:13px 18px; border:1px solid #3a7d44; border-radius:10px; color:#3a7d44; font-size:.88rem; }
    .done-banner.show { display:flex; }

    /* ── Spinner ── */
    .spinner { display:flex; align-items:center; gap:10px; padding:40px 0; color:var(--muted); font-size:.9rem; font-style:italic; }
    .spinner::before { content:''; width:18px; height:18px; border:2px solid var(--border); border-top-color:var(--accent); border-radius:50%; animation:spin .7s linear infinite; flex-shrink:0; }
    @keyframes spin { to { transform:rotate(360deg); } }

    /* ── Fullscreen ── */
    .page-shell.fullscreen .topbar,
    .page-shell.fullscreen .settings-panel,
    .page-shell.fullscreen .week-header,
    .page-shell.fullscreen .day-tabs { display:none !important; }
    .page-shell.fullscreen .reading-area { padding-top:20px; }
    .page-shell.fullscreen .reading-area.page-mode { padding-top:0; }
    .fs-exit-hint { display:none; position:fixed; top:14px; right:14px; z-index:999; font-size:.72rem; color:var(--muted); background:var(--bg); border:1px solid var(--border); border-radius:6px; padding:5px 10px; opacity:.7; }
    .page-shell.fullscreen .fs-exit-hint { display:block; }

    @media(max-width:600px) {
      .topbar { padding:11px 16px; }
      .settings-panel { padding:12px 16px 14px; }
      html[data-margins="wide"] { --reading-px: 20px; }
      .page-nav { padding:8px 16px 12px; }
    }
  </style>
</head>

const DAY_NAMES = ['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];

// ── Progress ───────────────────────────────────────────────────────────────
const WP_KEY = 'doa_week_progress';
function getWP()    { try { return JSON.parse(localStorage.getItem(WP_KEY)||'{}'); } catch(e) { return {}; } }
function saveWP(wp) { localStorage.setItem(WP_KEY, JSON.stringify(wp)); }
function isDayDone(weekN, day) { const wp = getWP(); return !!(wp['w'+weekN] && wp['w'+weekN][day]); }
function isWeekDone(n) { return DAYS.every(d => isDayDone(n, d)); }

function markDayDone(weekN, day) {
  const wp = getWP(), wk = 'w'+weekN;
  if (!wp[wk]) wp[wk] = {};
  wp[wk][day] = true;
  saveWP(wp);
  const uid = localStorage.getItem('doa_current_user_id');
  if (uid) {
    const upd = {};
    upd['progress.'+wk+'_'+day] = { read:true, readAt:new Date().toISOString() };
    db.collection('users').doc(uid).update(upd).catch(()=>{});
  }
}

// ── Display settings ───────────────────────────────────────────────────────
const SETTINGS_KEYS = { theme:'doa_theme', font:'doa_font_type', spacing:'doa_line_spacing', margins:'doa_margins', view:'doa_view_mode' };
const SETTINGS_DEFAULTS = { theme:'sepia', font:'serif', spacing:'normal', margins:'normal', view:'scroll' };

function loadSettings() {
  const root = document.documentElement;
  Object.keys(SETTINGS_KEYS).forEach(k => {
    const val = localStorage.getItem(SETTINGS_KEYS[k]) || SETTINGS_DEFAULTS[k];
    root.setAttribute('data-'+k, val);
  });
  const fsIdx = localStorage.getItem('doa_font_size_idx');
  if (fsIdx !== null) applyFontSize(parseInt(fsIdx, 10));
  syncSettingButtons();
}

function setSetting(key, val) {
  document.documentElement.setAttribute('data-'+key, val);
  localStorage.setItem(SETTINGS_KEYS[key], val);
  syncSettingButtons();
  if (key === 'view') applyViewMode(val);
}

function syncSettingButtons() {
  document.querySelectorAll('.seg-btn[data-setting]').forEach(btn => {
    const cur = document.documentElement.getAttribute('data-'+btn.dataset.setting);
    btn.classList.toggle('active', btn.dataset.val === cur);
  });
}

function toggleSettings() {
  const panel = document.getElementById('settings-panel');
  const btn   = document.getElementById('settings-btn');
  panel.classList.toggle('open');
  btn.classList.toggle('open', panel.classList.contains('open'));
}

// ── Font size ──────────────────────────────────────────────────────────────
const FONT_SIZES = [0.82, 0.92, 1.02, 1.12, 1.22, 1.35];
function applyFontSize(idx) { document.documentElement.style.setProperty('--reading-font-size', FONT_SIZES[idx]+'rem'); }
function adjustFontSize(dir) {
  let idx = parseInt(localStorage.getItem('doa_font_size_idx')||'2', 10);
  idx = Math.max(0, Math.min(FONT_SIZES.length-1, idx+dir));
  localStorage.setItem('doa_font_size_idx', idx);
  applyFontSize(idx);
}

// ── Fullscreen ─────────────────────────────────────────────────────────────
function toggleFullscreen() {
  const shell = document.getElementById('page-shell');
  const isFs  = shell.classList.contains('fullscreen');
  if (isFs) {
    shell.classList.remove('fullscreen');
    if (document.exitFullscreen) document.exitFullscreen().catch(()=>{});
  } else {
    shell.classList.add('fullscreen');
    if (document.documentElement.requestFullscreen) document.documentElement.requestFullscreen().catch(()=>{});
  }
}
document.addEventListener('fullscreenchange', () => {
  if (!document.fullscreenElement) document.getElementById('page-shell').classList.remove('fullscreen');
});
document.addEventListener('keydown', e => {
  if (e.key === 'Escape') document.getElementById('page-shell').classList.remove('fullscreen');
  if (e.key === 'ArrowRight') goPage(1);
  if (e.key === 'ArrowLeft')  goPage(-1);
});

// ── Pagination ─────────────────────────────────────────────────────────────
const PARAS_PER_PAGE = 3;
let currentPage = 0, totalPages = 1;
let _currentDayParas = [], _currentDayQuiz = null, _currentDayDone = false, _currentDayIdx = 0;

function applyViewMode(mode) {
  const area = document.getElementById('reading-area');
  const nav  = document.getElementById('page-nav');
  if (mode === 'page') {
    area.classList.add('page-mode');
    nav.style.display = 'flex';
    renderPage(currentPage);
  } else {
    area.classList.remove('page-mode');
    nav.style.display = 'none';
    renderDayContent(_currentDayIdx, true);
  }
}

function goPage(dir) {
  const newPage = currentPage + dir;
  if (newPage < 0 || newPage >= totalPages) return;
  currentPage = newPage;
  renderPage(currentPage);
  document.getElementById('reading-area').scrollTop = 0;
}

function renderPage(pageIdx) {
  const paras  = _currentDayParas;
  const quiz   = _currentDayQuiz;
  const done   = _currentDayDone;
  const dayIdx = _currentDayIdx;

  // Last page is a dedicated quiz/complete page when there's a quiz
  const textPages  = Math.max(1, Math.ceil(paras.length / PARAS_PER_PAGE));
  const isQuizPage = quiz && pageIdx === totalPages - 1;
  const isLastPage = pageIdx === totalPages - 1;

  let html = '<div class="reading-inner">';

  if (isQuizPage) {
    // Dedicated quiz page
    html += '<div class="day-heading" style="margin-bottom:24px">'+DAY_NAMES[dayIdx]+' — Discussion</div>';
    html += buildQuizHTML(quiz, done);
    if (done) {
      html += '<div class="done-banner show">✓ '+DAY_NAMES[dayIdx]+' completed</div>';
      if (dayIdx < 6 || weekN < 58)
        html += '<button class="complete-day-btn show" onclick="advanceDay('+dayIdx+')">'+(dayIdx===6?'Back to Contents':DAY_NAMES[dayIdx+1]+' →')+'</button>';
    } else {
      const lbl = dayIdx===6?(weekN<58?'Complete Week '+weekN+' →':'Complete Final Week →'):'Complete '+DAY_NAMES[dayIdx]+' →';
      html += '<button class="complete-day-btn" id="complete-btn" onclick="completeDay('+dayIdx+')">'+lbl+'</button>';
    }
  } else {
    // Text page
    if (pageIdx === 0) {
      const imgUrl = dayImages[dayIdx];
      if (imgUrl) html += '<img class="day-image" id="day-img" src="'+imgUrl+'" alt="" />';
      html += '<div class="day-heading">'+DAY_NAMES[dayIdx]+' — '+headingTitle(dayIdx)+'</div>';
    }
    const start = pageIdx * PARAS_PER_PAGE;
    const slice = paras.slice(start, start + PARAS_PER_PAGE);
    if (slice.length) html += '<div class="reading-text">'+slice.join('')+'</div>';
    else html += '<p class="no-content">Reading content for this chapter is being prepared. Please check back soon.</p>';

    // If no quiz, show complete button on last text page
    if (!quiz && isLastPage) {
      if (done) {
        html += '<div class="done-banner show">✓ '+DAY_NAMES[dayIdx]+' completed</div>';
        if (dayIdx < 6 || weekN < 58)
          html += '<button class="complete-day-btn show" onclick="advanceDay('+dayIdx+')">'+(dayIdx===6?'Back to Contents':DAY_NAMES[dayIdx+1]+' →')+'</button>';
      } else {
        const lbl = dayIdx===6?(weekN<58?'Complete Week '+weekN+' →':'Complete Final Week →'):'Complete '+DAY_NAMES[dayIdx]+' →';
        html += '<button class="complete-day-btn show" id="complete-btn" onclick="completeDay('+dayIdx+')">'+lbl+'</button>';
      }
    }
  }

  html += '</div>';
  document.getElementById('reading-area').innerHTML = html;

  // Update nav buttons
  const prevBtn = document.getElementById('prev-page-btn');
  const nextBtn = document.getElementById('next-page-btn');
  const counter = document.getElementById('page-counter');
  if (prevBtn) prevBtn.disabled = pageIdx === 0;
  if (nextBtn) {
    nextBtn.disabled = isLastPage;
    nextBtn.textContent = isLastPage ? '—' : (pageIdx === totalPages - 2 && quiz ? 'Quiz →' : 'Next →');
  }
  if (counter) counter.textContent = isQuizPage ? 'Quiz' : 'Page '+(pageIdx+1)+' of '+textPages;

  const img = document.getElementById('day-img');
  if (img) img.onload = () => img.classList.add('visible');
  if (isQuizPage && done) document.querySelectorAll('.choice-btn').forEach(b => { b.disabled = true; });
}

// ── Content helpers ────────────────────────────────────────────────────────
function parseContent(text) {
  if (!text) return [];
  if (/<[a-z]/i.test(text)) {
    const div = document.createElement('div');
    div.innerHTML = text;
    const ps = div.querySelectorAll('p');
    if (ps.length) return Array.from(ps).map(p => p.outerHTML);
    return ['<p>'+text+'</p>'];
  }
  return text.split(/\n{2,}/).map(s => s.trim()).filter(Boolean).map(s => '<p>'+s+'</p>');
}

function splitIntoNParts(arr, n) {
  const out = [];
  for (let i=0; i<n; i++) {
    const s = Math.floor((i*arr.length)/n), e = Math.floor(((i+1)*arr.length)/n);
    out.push(arr.slice(s, e));
  }
  return out;
}

function formatDateRange(start, end) {
  const f = d => new Date(d+'T12:00:00').toLocaleDateString('en-US',{month:'short',day:'numeric'});
  return f(start)+' – '+f(end)+', '+new Date(end+'T12:00:00').getFullYear();
}

function headingTitle(dayIdx) {
  const parts = weekMeta.title.split(';');
  return (parts[Math.floor(dayIdx/(weekMeta.chapters.length===1?7:3.5))] || parts[0]).trim();
}

// ── State ──────────────────────────────────────────────────────────────────
let weekN = 1, weekMeta = null, currentDay = 0;
let dayParas = [], dayQuizzes = [], dayImages = [];
let quizAnswered = false;

// ── Init ───────────────────────────────────────────────────────────────────
async function init() {
  loadSettings();

  const params = new URLSearchParams(location.search);
  weekN = parseInt(params.get('w')||'1', 10);
  const dayParam = params.get('day');
  currentDay = dayParam ? Math.max(0, DAYS.indexOf(dayParam.toLowerCase())) : new Date().getDay();

  weekMeta = WEEKS.find(w => w.n === weekN);
  if (!weekMeta) { document.getElementById('reading-area').innerHTML = '<div class="reading-inner"><p>Week not found.</p></div>'; return; }

  document.title = 'Week '+weekN+' — The Desire of Ages';
  document.getElementById('week-label').textContent = 'Week '+weekN;
  document.getElementById('week-title').textContent = weekMeta.title;
  document.getElementById('week-dates').textContent = formatDateRange(weekMeta.start, weekMeta.end);

  const snaps = await Promise.all(weekMeta.chapters.map(n => db.collection('chExtras').doc('ch-'+n).get().catch(()=>null)));

  let allParas = [], quizBoundaries = [];
  const imgByChIdx = {};

  snaps.forEach((snap, ci) => {
    if (!snap || !snap.exists) return;
    const d = snap.data();
    if (d.images && d.images[0] && d.images[0].url) imgByChIdx[ci] = d.images[0].url;
    const p1 = parseContent(d.content), p2 = parseContent(d.content2);
    if (d.quiz && d.quiz[0]) quizBoundaries.push({ afterIdx: allParas.length+p1.length-1, quiz:d.quiz[0] });
    allParas = allParas.concat(p1);
    if (d.quiz && d.quiz[1]) quizBoundaries.push({ afterIdx: allParas.length+p2.length-1, quiz:d.quiz[1] });
    allParas = allParas.concat(p2);
  });

  dayParas   = splitIntoNParts(allParas, 7);
  dayQuizzes = new Array(7).fill(null);
  dayImages  = new Array(7).fill(null);

  let parasCounted = 0;
  for (let d=0; d<7; d++) {
    parasCounted += dayParas[d].length;
    for (const qb of quizBoundaries) {
      if (qb.afterIdx < parasCounted && !dayQuizzes[d] && !Object.values(dayQuizzes).includes(qb.quiz))
        dayQuizzes[d] = qb.quiz;
    }
  }
  const assigned = new Set(dayQuizzes.filter(Boolean));
  const unassigned = quizBoundaries.map(q=>q.quiz).filter(q=>!assigned.has(q));
  for (let d=0; d<7; d++) { if (!dayQuizzes[d] && unassigned.length) dayQuizzes[d] = unassigned.shift(); }

  if (imgByChIdx[0]) dayImages[0] = imgByChIdx[0];
  if (imgByChIdx[1]) dayImages[3] = imgByChIdx[1];

  renderTabs();
  renderDay(currentDay);

  // Touch swipe for pagination
  let touchStartX = 0;
  document.getElementById('reading-area').addEventListener('touchstart', e => { touchStartX = e.touches[0].clientX; }, { passive:true });
  document.getElementById('reading-area').addEventListener('touchend', e => {
    const dx = e.changedTouches[0].clientX - touchStartX;
    if (Math.abs(dx) > 50) goPage(dx < 0 ? 1 : -1);
  }, { passive:true });
}

// ── Tabs ───────────────────────────────────────────────────────────────────
function renderTabs() {
  const el = document.getElementById('day-tabs');
  el.innerHTML = '';
  DAYS.forEach((day, i) => {
    const tab = document.createElement('div');
    tab.className = 'day-tab'+(i===currentDay?' active':'')+(isDayDone(weekN,day)?' done':'');
    tab.textContent = DAY_NAMES[i].slice(0,3).toUpperCase();
    tab.onclick = () => switchDay(i);
    el.appendChild(tab);
  });
}

function switchDay(i) {
  currentDay = i;
  renderTabs();
  renderDay(i);
  document.getElementById('reading-area').scrollTop = 0;
}

// ── Render day ─────────────────────────────────────────────────────────────
function renderDay(dayIdx) {
  quizAnswered = isDayDone(weekN, DAYS[dayIdx]);
  _currentDayParas = dayParas[dayIdx] || [];
  _currentDayQuiz  = dayQuizzes[dayIdx];
  _currentDayDone  = isDayDone(weekN, DAYS[dayIdx]);
  _currentDayIdx   = dayIdx;
  currentPage = 0;

  const viewMode = localStorage.getItem('doa_view_mode') || 'scroll';

  if (viewMode === 'page') {
    const textPgs = Math.max(1, Math.ceil(_currentDayParas.length / PARAS_PER_PAGE));
    totalPages = _currentDayQuiz ? textPgs + 1 : textPgs;
    document.getElementById('reading-area').classList.add('page-mode');
    document.getElementById('page-nav').style.display = 'flex';
    renderPage(0);
  } else {
    document.getElementById('reading-area').classList.remove('page-mode');
    document.getElementById('page-nav').style.display = 'none';
    renderDayContent(dayIdx, false);
  }
}

function renderDayContent(dayIdx, fromSettingsChange) {
  const paras  = _currentDayParas;
  const quiz   = _currentDayQuiz;
  const done   = _currentDayDone;
  const imgUrl = dayImages[dayIdx];

  let html = '<div class="reading-inner">';
  if (imgUrl) html += '<img class="day-image" id="day-img" src="'+imgUrl+'" alt="" />';
  html += '<div class="day-heading">'+DAY_NAMES[dayIdx]+' — '+headingTitle(dayIdx)+'</div>';

  if (paras.length) html += '<div class="reading-text">'+paras.join('')+'</div>';
  else html += '<p class="no-content">Reading content for this chapter is being prepared. Please check back soon.</p>';

  if (quiz) html += buildQuizHTML(quiz, done);

  if (done) {
    html += '<div class="done-banner show">✓ '+DAY_NAMES[dayIdx]+' completed'+(dayIdx===6&&weekN===58?' — You have completed all 58 weeks!':'')+'</div>';
    if (dayIdx<6||weekN<58) html += '<button class="complete-day-btn show" onclick="advanceDay('+dayIdx+')">'+(dayIdx===6?'Back to Contents':DAY_NAMES[dayIdx+1]+' →')+'</button>';
  } else {
    const lbl = dayIdx===6?(weekN<58?'Complete Week '+weekN+' →':'Complete Final Week →'):'Complete '+DAY_NAMES[dayIdx]+' →';
    html += '<button class="complete-day-btn" id="complete-btn" onclick="completeDay('+dayIdx+')">'+lbl+'</button>';
  }
  html += '</div>';
  document.getElementById('reading-area').innerHTML = html;

  const img = document.getElementById('day-img');
  if (img) img.onload = function() { img.classList.add('visible'); };
  if (!quiz||done) { const b = document.getElementById('complete-btn'); if (b) b.classList.add('show'); }
  if (done) document.querySelectorAll('.choice-btn').forEach(b => { b.disabled = true; });
}

function buildQuizHTML(quiz, alreadyDone) {
  let html = '<div class="quiz-block"><span class="quiz-label">Discussion Question</span>';
  html += '<p class="quiz-question">'+quiz.question+'</p>';
  html += '<div class="quiz-choices">';
  if (quiz.options && quiz.options.length) {
    quiz.options.forEach((opt,i) => {
      html += '<button class="choice-btn"'+(alreadyDone?' disabled':'')+' onclick="handleAnswer(this,'+(i===quiz.correct)+','+i+','+quiz.correct+')">'+opt+'</button>';
    });
  } else {
    html += '<button class="choice-btn"'+(alreadyDone?' disabled':'')+' onclick="handleAnswer(this,true,0,0)">True</button>';
    html += '<button class="choice-btn"'+(alreadyDone?' disabled':'')+' onclick="handleAnswer(this,false,1,0)">False</button>';
  }
  html += '</div><div class="quiz-feedback" id="quiz-fb"></div></div>';
  return html;
}

function handleAnswer(btn, isCorrect, chosenIdx, correctIdx) {
  if (quizAnswered) return;
  btn.closest('.quiz-choices').querySelectorAll('.choice-btn').forEach((b,i) => {
    b.disabled = true;
    if (i === correctIdx) b.classList.add('correct');
  });
  if (!isCorrect) btn.classList.add('wrong');
  const quiz = _currentDayQuiz;
  const fb   = document.getElementById('quiz-fb');
  if (fb && quiz) {
    fb.className = 'quiz-feedback '+(isCorrect?'correct':'wrong');
    fb.textContent = (isCorrect?'✓ ':'✗ ')+(isCorrect?(quiz.explanation_correct||'Correct!'):(quiz.explanation_wrong||'Not quite — review the reading and try again.'));
  }
  quizAnswered = true;
  const btn2 = document.getElementById('complete-btn');
  if (btn2) btn2.classList.add('show');
}

function completeDay(dayIdx) {
  markDayDone(weekN, DAYS[dayIdx]);
  renderTabs();
  if (dayIdx === 6) {
    if (weekN < 58) sessionStorage.setItem('doa_just_unlocked', 'w'+(weekN+1));
    window.location.href = '../index.html';
  } else {
    switchDay(dayIdx+1);
  }
}

function advanceDay(dayIdx) {
  if (dayIdx === 6) window.location.href = '../index.html';
  else switchDay(dayIdx+1);
}

init();
</script>
